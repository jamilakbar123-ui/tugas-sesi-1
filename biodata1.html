<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Biodata</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #333;
    }

    /* SECTION 1 - MENU */
    .menu {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #2c3e50;
      color: white;
    }

    .menu .logo {
      font-weight: bold;
      font-size: 18px;
    }

    .menu ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    .menu ul li {
      cursor: pointer;
    }

    /* SECTION 2 - HERO */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 50px;
      background: white;
    }

    .hero-text {
      max-width: 50%;
    }

    .hero-text h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .hero-text p {
      font-size: 16px;
      color: #666;
    }

    .hero img {
      width: 250px;
      border-radius: 10px;
    }

    /* SECTION 3 - BIODATA */
    .biodata {
      padding: 50px;
    }

    .biodata h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    /* SECTION 4 - PORTOFOLIO */
    .portfolio {
      padding: 50px;
      background: #fff;
    }

    .portfolio h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #f8f8f8;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }

      .grid, .portfolio-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- SECTION 1 MENU -->
  <div class="menu">
    <div class="logo">MyProfile</div>
    <ul>
      <li>Home</li>
      <li>Biodata</li>
      <li>Portfolio</li>
      <li>Contact</li>
    </ul>
  </div>

  <!-- SECTION 2 HERO -->
  <div class="hero">
    <div class="hero-text">
      <h1>Halo, Saya Developer</h1>
      <p>Ini adalah halaman profile sederhana menggunakan HTML dan CSS modern yang mudah dipelajari.</p>
    </div>
    <img src="https://via.placeholder.com/250" alt="Profile" />
  </div>

  <!-- SECTION 3 BIODATA -->
  <div class="biodata">
    <h2>Biodata</h2>
    <div class="grid">
      <div class="box">Nama</div>
      <div class="box">Umur</div>
      <div class="box">Alamat</div>
      <div class="box">Pendidikan</div>
      <div class="box">Hobi</div>
      <div class="box">Email</div>
    </div>
  </div>

  <!-- SECTION 4 PORTFOLIO -->
  <div class="portfolio">
    <h2>Portfolio</h2>
    <div class="portfolio-grid">
      <div class="card">Project 1</div>
      <div class="card">Project 2</div>
      <div class="card">Project 3</div>
    </div>
  </div>

</body>
</html>
